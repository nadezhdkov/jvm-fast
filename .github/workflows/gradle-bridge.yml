name: gradle-bridge

on:
  push:
    branches: [main]
    paths:
      - "gradle-bridge/**"
      - ".github/workflows/gradle-bridge.yml"
  pull_request:
    paths:
      - "gradle-bridge/**"
      - ".github/workflows/gradle-bridge.yml"

jobs:
  build:
    name: build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradle-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: ./gradlew build
        run: ./gradlew build --no-daemon
